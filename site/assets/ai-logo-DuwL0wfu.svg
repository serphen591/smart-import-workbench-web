<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Premium gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE96A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD84D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBE2E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient for premium look -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1114;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22262B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Highlight gradient -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.08" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  
  <!-- Main background with rounded corners -->
  <rect x="8" y="8" width="112" height="112" rx="20" ry="20" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner highlight for premium effect -->
  <rect x="10" y="10" width="108" height="108" rx="18" ry="18" fill="none" stroke="url(#highlightGradient)" stroke-width="1" opacity="0.8"/>

  <!-- Brand lockup: FFAI -->
  <g transform="translate(0, 0)">
    <!-- First F -->
    <g transform="translate(20, 30)">
      <!-- 竖线 -->
      <rect x="0" y="0" width="5" height="40" rx="1" fill="url(#textGradient)"/>
      <!-- 上横线 -->
      <rect x="0" y="0" width="20" height="5" rx="1" fill="url(#textGradient)"/>
      <!-- 中横线 -->
      <rect x="0" y="17" width="16" height="5" rx="1" fill="url(#textGradient)"/>
    </g>

    <!-- Second F -->
    <g transform="translate(45, 30)">
      <!-- 竖线 -->
      <rect x="0" y="0" width="5" height="40" rx="1" fill="url(#textGradient)"/>
      <!-- 上横线 -->
      <rect x="0" y="0" width="20" height="5" rx="1" fill="url(#textGradient)"/>
      <!-- 中横线 -->
      <rect x="0" y="17" width="16" height="5" rx="1" fill="url(#textGradient)"/>
    </g>

    <!-- A -->
    <g transform="translate(72, 30)">
      <path d="M 4 40 L 10 0 L 16 40" stroke="url(#textGradient)" stroke-width="5" 
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="7" y="24" width="6" height="4" rx="1" fill="url(#textGradient)"/>
    </g>

    <!-- I -->
    <g transform="translate(94, 30)">
      <rect x="6" y="0" width="5" height="40" rx="1" fill="url(#textGradient)"/>
      <rect x="2" y="0" width="13" height="5" rx="1" fill="url(#textGradient)"/>
      <rect x="2" y="35" width="13" height="5" rx="1" fill="url(#textGradient)"/>
    </g>
  </g>

  <!-- Small caption (optional, subtle) -->
  <text x="64" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="url(#textGradient)" opacity="0.85">FEIFAN AI</text>
</svg>
